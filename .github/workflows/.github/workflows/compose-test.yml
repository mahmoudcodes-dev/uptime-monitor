name: compose-test
on: [push, workflow_dispatch]
jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Add monitor
        run: |
          curl -fs -X POST http://localhost:8000/monitors -H 'Content-Type: application/json' -d '{"url":"https://example.com"}'
          curl -fs http://localhost:8000/monitors
      - run: docker compose down -v
